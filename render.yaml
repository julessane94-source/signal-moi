# Signal-moi : API Node persistante + PostgreSQL managé
# Les secrets sont générés par Render et ne sont jamais stockés dans Git.
services:
  - type: web
    name: signal-moi-backend
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        fromDatabase:
          name: signal-moi-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ADMIN_SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: https://signal-moi.vercel.app

databases:
  - name: signal-moi-db
    databaseName: signal_moi_db_2fq0
    plan: free
    region: frankfurt
    postgresMajorVersion: "16"
